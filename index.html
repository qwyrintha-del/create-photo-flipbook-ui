<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#eff3f7">
<title>给你的相册</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css?v=20261018c">
<link rel="stylesheet" href="reader.css?v=20261018c">
</head>
<body>
<main id="gate">
<div class="mark" aria-hidden="true"><img src="stickers/flower.png" alt=""></div><img class="gate-star" src="stickers/star.png" alt="" aria-hidden="true">
<p class="eyebrow">一份只与你分享的日常</p>
<h1>给你的相册</h1>
<p class="intro">输入分享者给你的密码，<br>慢慢翻开这些小日子。</p>
<form id="unlock-form">
<label for="password">访问密码</label>
<div class="password-row"><input id="password" name="password" type="password" inputmode="numeric" autocomplete="off" spellcheck="false" enterkeyhint="go" placeholder="输入或粘贴密码" required aria-describedby="status"><button id="reveal" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
<button id="unlock" type="submit">打开相册 <span aria-hidden="true">→</span></button>
<p id="status" role="status" aria-live="polite">输入密码后，就可以翻开啦。</p>
<progress id="progress" max="100" value="0" hidden aria-label="相册载入进度"></progress>
</form>
<p class="footnote">横屏翻阅 · 书页里藏着会动的小可爱<br>音乐、音效都可关闭，也可以切换简洁版。</p>
<p id="in-app-note" hidden>若抖音内打不开，请点右上角菜单，选择“在浏览器打开”。</p>
<noscript><p class="error">请在支持 JavaScript 的手机浏览器中打开此相册。</p></noscript>
</main>
<section id="reader" hidden aria-label="已解锁的相册">
<div id="reader-inner">
<div id="toolbar"><span id="reader-status">横屏双页 · 拖动书页翻阅</span><div>
<button id="view-mode" type="button" aria-pressed="false">简洁版</button>
<button id="music" type="button" aria-pressed="false">音乐：关闭</button>
<button id="effects" type="button" aria-pressed="true">音效：开启</button>
<button id="lock" type="button">关闭相册</button>
</div></div>
<div id="reader-loading" role="status" hidden>正在打开书页…</div>
<main id="reading-room">
<section id="book-stage" aria-label="可翻阅的照片书">
<img class="floating-sticker flower" src="stickers/flower.png" alt="" aria-hidden="true">
<div id="book-rig"></div>
<img class="floating-sticker star" src="stickers/star.png" alt="" aria-hidden="true">
</section>
<nav class="book-controls" aria-label="翻页控制">
<button id="previous" type="button" aria-label="上一页">←</button>
<div class="page-status"><span id="page-status" aria-live="polite">封面</span><small>拖动页角 · 松手翻页或回弹</small></div>
<button id="next" type="button" aria-label="下一页">→</button>
</nav>
</main>
</div></section>
<script src="vendor/page-flip.browser.js?v=20261018c"></script>
<script src="music.js?v=20261018c"></script>
<script src="reader.js?v=20261018c"></script>
<script src="app.js?v=20261018c"></script>
</body></html>
