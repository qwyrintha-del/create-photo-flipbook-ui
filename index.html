<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#eff3f7">
<title>给你的相册</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="gate">
<div class="mark" aria-hidden="true">▤</div>
<p class="eyebrow">一份只与你分享的日常</p>
<h1>给你的相册</h1>
<p class="intro">输入分享者给你的密码，<br>慢慢翻开这些小日子。</p>
<form id="unlock-form">
<label for="password">访问密码</label>
<div class="password-row"><input id="password" name="password" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="输入或粘贴密码" required aria-describedby="status"><button id="reveal" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
<button id="unlock" type="submit">打开相册 <span aria-hidden="true">→</span></button>
<p id="status" role="status" aria-live="polite">密码中的横线和空格可以省略。</p>
<progress id="progress" max="100" value="0" hidden aria-label="相册载入进度"></progress>
</form>
<p class="footnote">解锁后横屏翻阅 · 轻柔背景音乐可随时关闭</p><p id="in-app-note" hidden>如果抖音内无法打开或没有声音，请点右上角菜单，选择“在浏览器打开”。</p>
</main>
<section id="reader" hidden aria-label="已解锁的相册"><div id="reader-inner"><div id="toolbar"><span>横屏双页 · 滑动翻阅</span><div><button id="music" type="button" aria-pressed="false">音乐：关闭</button><button id="lock" type="button">关闭相册</button></div></div><iframe id="book-frame" title="照片翻页相册" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></div></section>
<script src="music.js"></script><script src="app.js"></script>
</body></html>
